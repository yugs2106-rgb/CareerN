    <script>
      // Filter out benign Vite HMR websocket reconnection notices in iframe sandbox preview
      (() => {
        const isBenignViteMsg = (msg) => {
          if (!msg) return false;
          const text = typeof msg === 'string' ? msg : (msg.message || '');
          return text.includes('[vite]') && (
            text.includes('failed to connect to websocket') ||
            text.includes('connecting...') ||
            text.includes('server restarted') ||
            text.includes('connected')
          );
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isBenignViteMsg)) return;
          origWarn.apply(console, args);
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isBenignViteMsg)) return;
          origError.apply(console, args);
        };
      })();
    </script>
